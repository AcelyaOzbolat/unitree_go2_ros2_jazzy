# Nav2 for the Unitree Go2 in simple_room.
#
# Three measurements from this robot drive most of the non-default choices here:
#
#   * The Velodyne's minimum range is 0.5 m, so anything closer is invisible to
#     /scan. Both costmaps therefore refuse to raytrace-clear below that range -
#     otherwise a wall the robot is about to touch gets erased from the costmap
#     exactly when it matters most - and the inflation radius is wide enough that
#     the planner never asks the robot to get that close in the first place.
#
#   * Abrupt cmd_vel changes topple this robot (measured: a step from 0.22 m/s
#     straight into a 0.45 rad/s turn puts it on its back). The controller's
#     output therefore goes through nav2_velocity_smoother before reaching CHAMP.
#
#   * The simulation runs at roughly 0.6x real time on this machine, so the
#     controller is Regulated Pure Pursuit rather than the stock MPPI, which
#     samples 2000 trajectories at 20 Hz.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # Naming these explicitly only silences a startup warning; the values are the
    # same ones bt_navigator falls back to on its own.
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # 2.0 s, not the stock 0.3. RPP flags "collision ahead" transiently while it
    # rotates in place to pick up a path that starts behind the robot, and with a
    # short patience the controller aborts the whole goal over it. Measured: goal
    # 2 died on "Controller patience exceeded" while the robot was in free space
    # 0.33 m from anything.
    failure_tolerance: 2.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # A walking Go2 covers ground slowly and pauses to turn, so the stock
      # 0.5 m in 10 s would report failure during a normal turn in place.
      required_movement_radius: 0.3
      movement_time_allowance: 20.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.35

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # gait.yaml caps the robot at 0.3 m/s and 0.5 rad/s; 0.20 and 0.40 leave
      # headroom, and 0.15 m/s is where this robot walked 216 s without falling.
      desired_linear_vel: 0.20
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.4
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.8
      use_collision_detection: true
      # 0.6 s ahead rather than 1.0. Projecting a full second of a rotate-in-place
      # command sweeps the footprint through nearby inflated cells and reports a
      # collision that never happens.
      max_allowed_time_to_collision_up_to_carrot: 0.6
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.10
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.6
      max_angular_accel: 0.8
      allow_reversing: false
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # The standing stance circumscribes at about 0.24 m, but this is deliberately
      # larger. A wheeled base that brushes a wall keeps rolling; a quadruped that
      # catches a swinging leg on one trips and goes down, and a fall costs the
      # whole run. 0.30 m buys margin for that, and the course was generated with
      # 1.2 m minimum gaps so it still fits everywhere it needs to.
      robot_radius: 0.30
      # static_layer belongs here, not just in the global costmap. The local
      # costmap's only other source is the live scan, and the Velodyne is blind
      # below 0.5 m - so an obstacle vanishes from the local costmap exactly as
      # the robot closes on it. Measured without this layer: the robot grazed
      # walls at 0.21 m, ended up inside loop_block's inflated footprint, and
      # NavFn could then not plan its way back out ("failed to create plan").
      # The saved map already knows where every wall and crate is; use it.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: base_footprint
          data_type: "LaserScan"
          clearing: True
          marking: True
          max_obstacle_height: 2.0
          # Matches the sensor's own 0.5 m floor. Without these, readings the
          # sensor cannot actually make are treated as "nothing there" and clear
          # real obstacles out of the costmap.
          raytrace_min_range: 0.5
          raytrace_max_range: 8.0
          obstacle_min_range: 0.5
          # Mark only what is close. A tilted laser slice lifts distant floor
          # returns into the band - at 3.8 deg of residual body tilt the floor
          # crosses a 0.25 m threshold from about 3.8 m out - and those became
          # phantom obstacles that flickered in and out of open space and made the
          # planner keep changing its mind. Clearing still reaches 8 m, and every
          # obstacle further out is already in the static layer from the map, so
          # the only thing given up is early marking of objects that are not on
          # the map at all.
          obstacle_max_range: 2.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Wide radius plus a gentle decay. cost_scaling_factor is what decides how
        # fast the inflated cost falls off with distance: at 3.0 it collapses
        # quickly, corner-cutting stays cheap, and the planner routes the robot
        # right along obstacle edges - which is where it was grazing loop_block.
        # 2.0 keeps the cost high further out, so the shortest path bends away.
        inflation_radius: 0.75
        cost_scaling_factor: 2.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.30
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: base_footprint
          data_type: "LaserScan"
          clearing: True
          marking: True
          max_obstacle_height: 2.0
          raytrace_min_range: 0.5
          raytrace_max_range: 8.0
          obstacle_min_range: 0.5
          # Mark only what is close. A tilted laser slice lifts distant floor
          # returns into the band - at 3.8 deg of residual body tilt the floor
          # crosses a 0.25 m threshold from about 3.8 m out - and those became
          # phantom obstacles that flickered in and out of open space and made the
          # planner keep changing its mind. Clearing still reaches 8 m, and every
          # obstacle further out is already in the static layer from the map, so
          # the only thing given up is early marking of objects that are not on
          # the map at all.
          obstacle_max_range: 2.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.75
        cost_scaling_factor: 2.0
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    # Recovery motions run slower than the stock values; this robot falls over
    # when commanded hard.
    max_rotational_vel: 0.4
    min_rotational_vel: 0.15
    rotational_acc_lim: 0.8

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # Ordered [x, y, theta]. The acceleration limits are the point of this node:
    # they turn the controller's step changes into ramps, which is what keeps the
    # robot upright through direction changes.
    max_velocity: [0.20, 0.0, 0.40]
    min_velocity: [-0.10, 0.0, -0.40]
    max_accel: [0.30, 0.0, 0.60]
    max_decel: [-0.50, 0.0, -1.00]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
